# 英文原文：Properties
varsdialog.properties = 属性

# 出现位置：变量/内存/属性界面中筛选按钮的文字；快照关闭时显示在底部，开启时显示在顶部工具栏。
#           同时用作“视图选项”对话框标题。
# 英文原文：Options
varsdialog.options = 视图选项

# 出现位置：视图选项对话框 → 数字进制选择的“十进制”按钮。
# 英文原文：Dec
varsdialog.dec = 十进制

# 出现位置：视图选项对话框 → 数字进制选择的“十六进制”按钮；
#           快照关闭时，内存/属性界面底部也有同名切换按钮。
# 英文原文：Hex
varsdialog.hex = 十六进制

# 出现位置：视图选项对话框 → 变量排序方式的“已排序”按钮。
# 英文原文：Sorted
varsdialog.sorted = 已排序

# 出现位置：视图选项对话框 → 变量排序方式的“未排序”按钮。
# 英文原文：Unsorted
varsdialog.unsorted = 未排序

# 出现位置：视图选项对话框 → 临时变量过滤的“显示全部”按钮。
# 英文原文：Show all
varsdialog.showall = 显示全部

# 出现位置：视图选项对话框 → 临时变量过滤的“隐藏临时变量”按钮。
# 英文原文：Hide temps
varsdialog.hidetemps = 隐藏临时变量

# 出现位置：视图选项对话框 → 处理器连接过滤的“显示连接”按钮。
# 英文原文：Show links
varsdialog.showlinks = 显示连接

# 出现位置：视图选项对话框 → 处理器连接过滤的“隐藏连接”按钮。
# 英文原文：Hide links
varsdialog.hidelinks = 隐藏连接

# 出现位置：视图选项对话框 → 精度选择的“完整精度”按钮；
#           快照关闭时，内存/属性界面底部也有同名切换按钮。
# 英文原文：All digits
varsdialog.fullprecision = 完整精度

# 出现位置：视图选项对话框 → 精度选择的“指定位数”按钮。{0} 为当前有效数字位数。
# 英文原文：{0} digits
varsdialog.limitedprecission = {0} 位数字

# 出现位置：内存界面 → 点击铅笔/编辑按钮打开的“编辑”对话框中；仅实时内存视图显示。
# 英文原文：Clear memory
varsdialog.clearmemory = 清空内存

# 出现位置：任意变量/内存/属性界面 → 编辑对话框 → “将变量值复制到剪贴板”按钮。
# 英文原文：Copy values to the clipboard
varsdialog.copyvariables = 将变量值复制到剪贴板

# 出现位置：任意变量/内存/属性界面 → 编辑对话框 → “导出到文件”按钮。
# 英文原文：Export values to a file
varsdialog.exportvariablesfile = 将变量值导出到文件

# 出现位置：内存界面 → 编辑对话框 → “从剪贴板导入”按钮；仅实时内存视图显示。
# 英文原文：Import values from the clipboard
varsdialog.importvariables = 从剪贴板导入内存数据

# 出现位置：内存界面 → 编辑对话框 → “从文件导入”按钮；仅实时内存视图显示。
# 英文原文：Import values from a file
varsdialog.importvariablesfile = 从文件导入内存数据

# 出现位置：从剪贴板/文件导入内存数据后，若存在无法解析的行，弹出的错误提示。{0} 为错误详情。
# 英文原文：Invalid lines: {0}
varsdialog.importfailed = 无效行：{0}


# ----------------------------------------------------------------------------
# 自定义游戏规则
# ----------------------------------------------------------------------------

# 出现位置：游戏内“规则”对话框 → “Mlog Dev Tools”分类标题。
# 英文原文：Mlog Dev Tools map settings
rules.title.mlogdevtools = Mlog Dev Tools 地图设置

# 出现位置：游戏内“规则”对话框 → “Mlog Dev Tools”分类 → 复选框文字。
# 英文原文：Automatically profile all processors
rules.mlogdevtools.autoprofile = 自动分析所有处理器

# 出现位置：游戏内“规则”对话框 → “自动分析所有处理器”复选框的说明/提示。
# 英文原文：All processors loaded with the map, or currently present on the map, and all newly built processors will be profiled.
rules.mlogdevtools.autoprofile.info = 地图中已加载或当前存在的所有处理器，以及之后新建的所有处理器，都将进行性能分析。


# ----------------------------------------------------------------------------
# 设置界面
# 出现位置统一为：游戏设置 → “Mlog Dev Tools”分类。
# 每个 .name 是设置行标题，.description 是标题下方的说明文字；
# .none / .never / .once / .every / .disabled / .delay / .everyframe / .ticks
# 是对应滑条右侧当前值的显示文本。
# ----------------------------------------------------------------------------

# 设置行标题；英文原文：Disable breakpoints
setting.mlogdevtools-disable-breakpoints.name = 禁用断点
# 设置行说明；英文原文：Disabled breakpoints do not stop code execution.
setting.mlogdevtools-disable-breakpoints.description = 禁用后，断点不会停止代码执行。

# 设置行标题；英文原文：Breakpoint on failed assertions
setting.mlogdevtools-asserts-are-breakpoints.name = 断言失败时触发断点
# 设置行说明；英文原文：When enabled, a failed assertion triggers a breakpoint.\nWhen breakpoints are disabled, the assertion will be ignored.
setting.mlogdevtools-asserts-are-breakpoints.description = 启用后，断言失败将触发断点。\n若断点已禁用，则忽略该断言。

# 设置行标题；英文原文：Detach camera on breakpoint
setting.mlogdevtools-free-camera-on-breakpoint.name = 断点时分离镜头
# 设置行说明；英文原文：When a breakpoint is hit, the camera is temporarily detached to keep the processor centered in the view.
setting.mlogdevtools-free-camera-on-breakpoint.description = 命中断点时，镜头会暂时分离，以保持处理器位于视野中央。

# 设置行标题；英文原文：Max Instructions
setting.mlogdevtools-max-instructions.name = 最大指令数
# 设置行说明；英文原文：Overrides the instruction limit in logic processors. An increased limit may be used to add debugging code to your program.
setting.mlogdevtools-max-instructions.description = 覆盖逻辑处理器的指令数上限。提高上限可用于向程序添加调试代码。

# 设置行标题；英文原文：Show waits longer than (sec)
setting.mlogdevtools-min-wait-time-update.name = 显示超过此时长的等待（秒）
# 设置行说明；英文原文：The minimal wait time specified in the [gold]wait[] instruction parameter which causes the wait to be indicated on processors.
setting.mlogdevtools-min-wait-time-update.description = 当 [gold]wait[] 指令的参数中指定的等待时间不低于此值时，会在处理器上显示等待指示。
# 滑条值：0 时显示；英文原文：none
setting.mlogdevtools-min-wait-time-update.none = None

# 设置行标题；英文原文：Processors updated per tick
setting.mlogdevtools-processor-updates-per-tick.name = 每 tick 更新的处理器数
# 设置行说明；英文原文：The number of processors inspected in each tick. Larger values may decrease response time and increase the CPU usage.
setting.mlogdevtools-processor-updates-per-tick.description = 每个 tick 检查的处理器数量。数值越大，响应越快，但 CPU 占用越高。

# 设置行标题；英文原文：Visual warning
setting.mlogdevtools-warn-effect-frequency.name = 视觉警告
# 设置行说明；英文原文：The frequency of visual warnings on the map.
setting.mlogdevtools-warn-effect-frequency.description = 地图上视觉警告的显示频率。
# 滑条值；英文原文：never
setting.mlogdevtools-warn-effect-frequency.never = 从不
# 滑条值；英文原文：once
setting.mlogdevtools-warn-effect-frequency.once = 一次
# 滑条值；{0} 为秒数；英文原文：every {0} sec
setting.mlogdevtools-warn-effect-frequency.every = 每 {0} 秒

# 设置行标题；英文原文：Triple tap speed
setting.mlogdevtools-triple-tap-speed.name = 三击速度
# 设置行说明；英文原文：Triple-tapping a block within this interval opens the Sensors/Vars/Memory screen for the block.
setting.mlogdevtools-triple-tap-speed.description = 在此时间间隔内连续三次点击方块，会打开该方块的传感器/变量/内存界面。
# 滑条值：0 时显示；英文原文：disabled
setting.mlogdevtools-triple-tap-speed.disabled = 禁用
# 滑条值；{0} 为毫秒数；英文原文：{0} ms
setting.mlogdevtools-triple-tap-speed.delay = {0} 毫秒

# 设置行标题；英文原文：Snapshot limit
setting.mlogdevtools-snapshot-limit-0.name = 快照上限
# 设置行说明；英文原文：The maximum number of snapshots kept [accent]per block[].\nWarning: large values may cause memory or performance issues.
setting.mlogdevtools-snapshot-limit-0.description = [accent]每个方块[]保留的最大快照数。\n警告：数值过大会导致内存或性能问题。
# 滑条值：0 时显示；英文原文：Snapshots disabled
setting.mlogdevtools-snapshot-limit-0.disabled = 快照已禁用

# 设置行标题；英文原文：Take a snapshot on a breakpoint
setting.mlogdevtools-snapshot-on-breakpoint.name = 命中断点时创建快照
# 设置行说明；英文原文：When enabled, a connected snapshot will be automatically created when a breakpoint is triggered.
setting.mlogdevtools-snapshot-on-breakpoint.description = 启用后，触发断点时会自动创建关联快照。

# 设置行标题；英文原文：Take a snapshot on a failed assertion
setting.mlogdevtools-snapshot-on-assertion.name = 断言失败时创建快照
# 设置行说明；英文原文：When enabled, an isolated snapshot will be automatically created when an assertion fails.
setting.mlogdevtools-snapshot-on-assertion.description = 启用后，断言失败时会自动创建独立快照。

# 设置行标题；英文原文：Variable updates
setting.mlogdevtools-variable-update-frequency.name = 变量刷新频率
# 设置行说明；英文原文：The frequency of variable updates on the [accent]Vars[]/[accent]Memory[]/[accent]Properties[] screens.
setting.mlogdevtools-variable-update-frequency.description = [accent]变量[]/[accent]内存[]/[accent]属性[]界面中变量值的刷新频率。
# 滑条值；英文原文：every frame
setting.mlogdevtools-variable-update-frequency.everyframe = 每帧
# 滑条值；{0} 为 tick 数；英文原文：every {0} ticks
setting.mlogdevtools-variable-update-frequency.ticks = 每 {0} tick

# 设置行标题；英文原文：Significant digits
setting.mlogdevtools-vars-significant-digits.name = 有效数字
# 设置行说明；英文原文：The number of significant digits displayed on the Vars/Memory/Sensors screens.
setting.mlogdevtools-vars-significant-digits.description = 变量/内存/传感器界面显示的有效数字位数。

# 设置行标题；英文原文：Start the profiler immediately
setting.mlogdevtools-start-profiler-immediatelly.name = 立即启动性能分析器
# 设置行说明；英文原文：When enabled, profiling is started immediatelly upon entering the profiler screen.
setting.mlogdevtools-start-profiler-immediatelly.description = 启用后，进入性能分析器界面时会立即开始分析。

# 设置行标题；英文原文：Log size
setting.mlogdevtools-log-message-limit.name = 日志大小
# 设置行说明；英文原文：The maximum number of log messages kept per processor.
setting.mlogdevtools-log-message-limit.description = 每个处理器保留的最大日志消息数。
# 滑条值：0 时显示；英文原文：Logging disabled
setting.mlogdevtools-log-message-limit.disabled = 禁用日志记录

# 设置行标题；英文原文：Clear log on restart
setting.mlogdevtools-clear-log-on-restart.name = 重启时清空日志
# 设置行说明；英文原文：Clear the processor's log when the processor is restarted or recompiled.
setting.mlogdevtools-clear-log-on-restart.description = 处理器重启或重新编译时，清空其日志。
