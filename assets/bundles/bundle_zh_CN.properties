# ============================================================================
# Mlog Dev Tools - 简体中文 (zh_CN)
#
# 文件位置：assets/bundles/bundle_zh_CN.properties
# 编码：UTF-8（无需转义中文）
#
# 说明：
#   - 每个条目上方注释依次给出「出现位置」和「英文原文」。
#   - 未翻译的键会自动回退到 bundle.properties 中的英文，因此可以分批翻译。
#   - 值中的 {0}、{1}… 以及 [accent]、[gold]、[red] 等颜色标签必须原样保留。
# ============================================================================


# ----------------------------------------------------------------------------
# 逻辑指令分类
# ----------------------------------------------------------------------------

# 出现位置：逻辑编辑器 → “添加指令”对话框 → 列表顶部的分类标题。
# 英文原文：Dev Tools
lcategory.asserts = 开发工具

# 出现位置：逻辑编辑器 → “添加指令”对话框 → 将鼠标悬停/长按分类标题时显示的提示。
# 英文原文：Debugging and testing tools
lcategory.asserts.description = 调试与测试工具


# ----------------------------------------------------------------------------
# 逻辑指令说明（添加指令对话框中，悬停在指令按钮上的工具提示）
# ----------------------------------------------------------------------------

# 出现位置：逻辑编辑器 → 添加指令 → 悬停在“Assert”指令上。
# 英文原文：Halt execution of this processor when a condition is not met.
lst.assert = 若条件不成立，停止并抛出错误。

# 出现位置：逻辑编辑器 → 添加指令 → 悬停在“Assert Bounds”指令上。
# 英文原文：Halt execution of this processor when a complex assertion is not met.
lst.assertbounds = 若复杂条件非期望，停止并抛出错误。

# 出现位置：逻辑编辑器 → 添加指令 → 悬停在“Assert Equals”指令上。
# 英文原文：Halt execution of this processor when a variable doesn't match the expected value.
lst.assertequals = 若严格相等不成立，停止并显示这两个值。

# 出现位置：逻辑编辑器 → 添加指令 → 悬停在“Assert Type”指令上。
# 英文原文：Halt execution of this processor when a variable isn't of the expected type.
lst.asserttype = 若类型非期望，停止并显示这两个类型。

# 出现位置：逻辑编辑器 → 添加指令 → 悬停在“Assert Flush”指令上。
# 英文原文：Prepare this processor for executing the [accent]assertprints[] instruction.
lst.assertflush = 记录当前缓冲区位置为后 [accent]assertprints[] 指令比较输出的起点。

# 出现位置：逻辑编辑器 → 添加指令 → 悬停在“Assert Prints”指令上。
# 英文原文：Halt executionf of this processor when the text buffer content doesn't match the expected value.
lst.assertprints = 将自 assertflush 以来写入的文本与期望字符串比较，然后把缓冲区恢复到起点。不匹配时停止此处理器。

# 出现位置：逻辑编辑器 → 添加指令 → 悬停在“Error”指令上。
# 英文原文：Display the error message and halt execution of this processor.
lst.error = 显示指定消息并停止此处理器。

# 出现位置：逻辑编辑器 → 添加指令 → 悬停在“Log”指令上。
# 英文原文：Log a message with the current processor.
lst.log = 向当前处理器的日志添加一条消息。

# 出现位置：逻辑编辑器 → 添加指令 → 悬停在“Breakpoint”指令上。
# 英文原文：Pause the execution of all logic processors and the game when a condition is met.
lst.breakpoint = 条件成立时暂停游戏，并把镜头移到该处理器。

# 出现位置：逻辑编辑器 → 添加指令 → 悬停在“Profile”指令上。
# 英文原文：Activate, deactivate or reset profiling data of the target processor.
lst.profile = 启动、停止或清除目标处理器的性能分析数据。

# 出现位置：逻辑编辑器 → 添加指令 → 悬停在“Restart”指令上。
# 英文原文：Fully restart the target processor (clearing processor variables).
lst.restart = 让目标处理器从头重新执行代码，同时清空其变量。

# 出现位置：逻辑编辑器 → 添加指令 → 悬停在“Snapshot”指令上。
# 英文原文：Create a snapshot of the processor's or some other block's state.\nThe number of steps to record in a [accent]recording[] snapshot is limited\nby the maximum number of snapshots configured in settings.
lst.snapshot = 为指定方块创建状态快照。[accent]recording[] 会额外记录指定步数的执行过程；[accent]global[] 则记录地图上所有处理器和内存块。

# 出现位置：逻辑编辑器 → 添加指令 → 悬停在“System Log”指令上。
# 英文原文：Write a message into the game's log file with the specified level.
lst.systemlog = 按指定级别把消息写入游戏日志文件，而不是处理器的 Log 界面。


# ----------------------------------------------------------------------------
# 断点提示
# ----------------------------------------------------------------------------

# 出现位置：地图上处理器上方；断点指令命中、游戏暂停时显示。{0} 为指令序号。
# 英文原文：Breakpoint at #{0}
breakpoint.message = 断点位于 #{0}

# 出现位置：当前代码未引用（遗留键）。原文用于提示多人游戏中断点会被忽略。
# 英文原文：Breakpoint ignored in multiplayer.
breakpoint.multiplayer = 多人游戏中已忽略断点。


# ----------------------------------------------------------------------------
# 断言运行时消息
# （显示在地图上处理器上方，部分也会作为自动快照的名称）
# ----------------------------------------------------------------------------

# 出现位置：处理器执行 stop 指令停止后，地图上处理器上方。
# 英文原文：Stopped at #{0}
assertions.stoppedAt = 停止于 #{0}

# 出现位置：断言失败且没有提供自定义消息时，地图上处理器上方。
# 英文原文：Assertion failed.
assertions.assertionFailed = 断言失败。

# 出现位置：assertprints 指令使用了无效的刷新索引时，地图上处理器上方。
# 英文原文：[red]Invalid flush index.
assertions.invalidFlushIndex = [red]无效的刷新索引。

# 出现位置：assert 指令失败时，地图上处理器上方。
# 占位符：{0}=被测试值，{1}=比较值，{2}=运算符。
# 英文原文：Assertion [gold]{0}[] {2} [gold]{1}[] failed.
assertions.assertionFailedWithValues = 断言 [gold]{0}[] {2} [gold]{1}[] 失败。

# 出现位置：assertequals、assertprints 或 asserttype 指令失败时，地图上处理器上方。
# 占位符：{0}=期望值/类型，{1}=实际值/类型。
# 英文原文：Assertion failed: expected [gold]{0}[], got [gold]{1}[]
assertions.assertionEqualFailedWithValues = 断言失败：期望 [gold]{0}[]，实际 [gold]{1}[]

# 出现位置：assertbounds 指令失败时，地图上处理器上方。
# 占位符：{0}=最小值，{1}=被测试值，{2}=最大值，{3}=下限运算符，{4}=上限运算符。
# 英文原文：Assertion [gold]{0}[] {3} [gold]{1}[] {4} [gold]{2}[] failed.
assertions.boundsAssertionFailedWithValues = 断言 [gold]{0}[] {3} [gold]{1}[] {4} [gold]{2}[] 失败。


# ----------------------------------------------------------------------------
# 变量 / 内存 / 属性界面
# ----------------------------------------------------------------------------

# 出现位置：点击内存块打开内存界面时，窗口标题；也用作方块类型名称。
# 英文原文：Memory
varsdialog.memory = 内存

