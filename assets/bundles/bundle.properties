# Logic statements
lcategory.asserts = Dev Tools
lcategory.asserts.description = Debugging and testing tools

# Instruction tooltips/descriptions
lst.assert = Halt execution of this processor when a condition is not met.
lst.assertbounds = Halt execution of this processor when a complex assertion is not met.
lst.assertequals = Halt execution of this processor when a variable doesn't match the expected value.
lst.asserttype = Halt execution of this processor when a variable isn't of the expected type.
lst.assertflush = Prepare this processor for executing the [accent]assertprints[] instruction.
lst.assertprints = Halt execution of this processor when the text buffer content doesn't match the expected value.
lst.error = Display the error message and halt execution of this processor.
lst.log = Log a message with the current processor.
lst.breakpoint = Pause the execution of all logic processors and the game when a condition is met.
lst.profile = Activate, deactivate or reset profiling data of the target processor.
lst.restart = Fully restart the target processor (clearing processor variables).
lst.snapshot = Create a snapshot of the processor's or some other block's state.\nThe number of steps to record in a [accent]recording[] snapshot is limited\nby the maximum number of snapshots configured in settings.
lst.systemlog = Write a message into the game's log file with the specified level.

